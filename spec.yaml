id: snake_sightings

requirements:
  - name: ecoscope-workflows-core
    version: "0.22.17.*"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-ecoscope
    version: "0.22.17.*"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-custom
    version: "0.0.51.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: ecoscope-workflows-ext-ste
    version: "0.0.18.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: ecoscope-workflows-ext-taff
    version: "0.0.5.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: pandas
    version: ">=1.5.0"
    channel: conda-forge
  - name: pandera
    version: "0.26.0"
    channel: conda-forge
  - name: geopandas
    version: ">=0.13.0"
    channel: conda-forge
  - name: docxtpl
    version: ">=0.16"
    channel: conda-forge
  - name: plotly
    version: ">=5.0.0"
    channel: conda-forge
  - name: shapely
    version: ">=2.0.0"
    channel: conda-forge

rjsf-overrides:
  properties:
    "time_range.properties.since.default": "2000-01-01T00:00:00Z"
    "time_range.properties.until.default": "2026-04-01T00:00:00Z"

# Global default: skip tasks whose inputs are empty DataFrames only.
task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df

workflow:

  - name: Set workflow details
    id: workflow_details
    task: set_workflow_details

  - name: Define analysis time range
    id: time_range
    task: set_time_range

  - name: Configure grouping strategy
    id: groupers
    task: set_groupers
    partial:
      groupers: []

  - name: Connect to EarthRanger
    id: er_client
    task: set_er_connection

  # ═══════════════════════════════════════════════════════════════════════════
  # SECTION 1 — Fetch & clean data
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Fetch iNaturalist observations
    id: fetch_er_events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types:
        - inat_observation
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - title
        - reported_by
        - created_at
        - serial_number
        - is_collection
        - event_details
        - geometry
      include_details: true
      raise_on_empty: false
      include_null_geometry: true
      include_updates: false
      include_related_events: false
      include_display_values: true

  - name: Parse event details
    id: parse_details
    task: parse_event_details
    partial:
      gdf: ${{ workflow.fetch_er_events.return }}
      fields:
        - taxon_name
        - taxon_common_name
        - user_name
        - inat_id
      details_column: details

  - name: Filter to valid binomial species
    id: filter_species
    task: filter_binomial_species
    partial:
      gdf: ${{ workflow.parse_details.return }}
      name_column: taxon_name
      remove_spatial_outliers: true
      iqr_factor: 3.0

  # SECTION 2 — Species summary table

  - name: Build species summary table
    id: species_summary_df
    task: build_species_summary_table
    partial:
      gdf: ${{ workflow.filter_species.return }}
      name_column: taxon_name
      common_name_column: taxon_common_name
      observer_column: user_name
      id_column: inat_id
      time_column: time
      grid_size_meters: 1000
      planar_crs: EPSG:32737

  - name: Save summary table as Word doc
    id: summary_table_docx
    task: save_summary_table_as_docx
    partial:
      table_df: ${{ workflow.species_summary_df.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: species_summary_table.docx
      font_name: Arial
      font_size_pt: 9
      heading_font_size_pt: 11

  - name: Render species summary table as HTML
    id: species_summary_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.species_summary_df.return }}
      columns:
        - Number
        - Scientific Name
        - Common Name
        - Observations
        - Unique Observers
        - Unique Locations
        - First Observation
        - Last Observation
        - Range (km2)
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: false
        hide_header: false

  - name: Persist species summary table HTML
    id: persist_summary_html
    task: persist_text
    skipif: {}
    partial:
      text: ${{ workflow.species_summary_html.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: species_summary_table

  - name: Create summary table widget
    id: summary_table_widget
    task: create_map_widget_single_view
    skipif: {}
    partial:
      title: Species Summary Table
      data: ${{ workflow.persist_summary_html.return }}

  # ═══════════════════════════════════════════════════════════════════════════
  # SECTION 3 — All-species distribution map
  # prepare_all_species_points_gdf returns points + hull in one GDF.
  # draw_map receives exactly one layer — no SkipSentinel possible.
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Prepare all-species points GDF
    id: all_pts_gdf
    task: prepare_all_species_points_gdf
    partial:
      gdf: ${{ workflow.filter_species.return }}

  - name: All-species layer
    id: all_pts_layer
    task: create_geojson_layer
    partial:
      data_url: null
      geodataframe: ${{ workflow.all_pts_gdf.return }}
      layer_style:
        filled: true
        stroked: true
        get_fill_color: fill_color
        get_line_color: fill_color
        get_point_radius: 3
        point_radius_units: pixels
        point_radius_min_pixels: 5
        opacity: 1.0
      legend:
        title: All Snake Species
        label_column: bin_label
        color_column: fill_color

  - name: All-species view state
    id: all_view_state
    task: view_state_from_geodataframes
    skipif: {}
    partial:
      geodataframes:
        - ${{ workflow.all_pts_gdf.return }}
      max_zoom: 5

  - name: Draw all-species map
    id: draw_all_species_map
    task: draw_map
    skipif: {}
    partial:
      geo_layers:
        - ${{ workflow.all_pts_layer.return }}
      tile_layers:
        - layer_name: TERRAIN
          opacity: 1.0
        - layer_name: USGS HILLSHADE
          opacity: 0.25
      view_state: ${{ workflow.all_view_state.return }}
      static: true
      title: All Snake Species Distribution
      max_zoom: 5
      legend_style:
        placement: bottom-right

  - name: Persist all-species map HTML
    id: persist_all_species_html
    task: persist_text
    skipif: {}
    partial:
      text: ${{ workflow.draw_all_species_map.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: all_snakes_distribution

  - name: All-species map widget
    id: all_species_widget
    task: create_map_widget_single_view
    skipif: {}
    partial:
      title: All Snake Species Distribution
      data: ${{ workflow.persist_all_species_html.return }}

  # ═══════════════════════════════════════════════════════════════════════════
  # SECTION 4 — Observation effort map
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Create observation effort grid
    id: effort_grid
    task: create_observation_effort_grid
    partial:
      gdf: ${{ workflow.filter_species.return }}
      grid_size_meters: 15000
      planar_crs: EPSG:32737
      output_crs: EPSG:4326

  - name: Effort map layer
    id: effort_layer
    task: create_geojson_layer
    partial:
      data_url: null
      geodataframe: ${{ workflow.effort_grid.return }}
      layer_style:
        filled: true
        stroked: true
        get_fill_color: fill_color
        get_line_color: [80, 80, 80, 90]
        get_line_width: 0.6
        opacity: 1.0
      legend:
        title: Observation Effort (15 km grid)
        label_column: bin_label
        color_column: fill_color
        sort: ascending

  - name: Effort map view state
    id: effort_view_state
    task: view_state_from_geodataframes
    skipif: {}
    partial:
      geodataframes:
        - ${{ workflow.effort_grid.return }}
      max_zoom: 5

  - name: Draw observation effort map
    id: draw_effort_map
    task: draw_map
    skipif: {}
    partial:
      geo_layers:
        - ${{ workflow.effort_layer.return }}
      tile_layers:
        - layer_name: TERRAIN
          opacity: 1.0
        - layer_name: USGS HILLSHADE
          opacity: 0.25
      view_state: ${{ workflow.effort_view_state.return }}
      static: true
      title: Snake Observation Effort
      max_zoom: 5
      legend_style:
        placement: bottom-right

  - name: Persist effort map HTML
    id: persist_effort_html
    task: persist_text
    skipif: {}
    partial:
      text: ${{ workflow.draw_effort_map.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: observation_effort

  - name: Effort map widget
    id: effort_map_widget
    task: create_map_widget_single_view
    skipif: {}
    partial:
      title: Snake Observation Effort
      data: ${{ workflow.persist_effort_html.return }}

  # ═══════════════════════════════════════════════════════════════════════════
  # SECTION 5 — Species richness map
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Create species richness grid
    id: richness_grid
    task: create_species_richness_grid
    partial:
      gdf: ${{ workflow.filter_species.return }}
      name_column: taxon_name
      grid_size_meters: 15000
      planar_crs: EPSG:32737
      output_crs: EPSG:4326

  - name: Richness map layer
    id: richness_layer
    task: create_geojson_layer
    partial:
      data_url: null
      geodataframe: ${{ workflow.richness_grid.return }}
      layer_style:
        filled: true
        stroked: true
        get_fill_color: fill_color
        get_line_color: [80, 80, 80, 90]
        get_line_width: 0.5
        opacity: 1.0
      legend:
        title: Snake Species Richness (15 km grid)
        label_column: bin_label
        color_column: fill_color
        sort: ascending

  - name: Richness map view state
    id: richness_view_state
    task: view_state_from_geodataframes
    skipif: {}
    partial:
      geodataframes:
        - ${{ workflow.richness_grid.return }}
      max_zoom: 5

  - name: Draw species richness map
    id: draw_richness_map
    task: draw_map
    skipif: {}
    partial:
      geo_layers:
        - ${{ workflow.richness_layer.return }}
      tile_layers:
        - layer_name: TERRAIN
          opacity: 1.0
        - layer_name: USGS HILLSHADE
          opacity: 0.25
      view_state: ${{ workflow.richness_view_state.return }}
      static: true
      title: Snake Species Richness
      max_zoom: 5
      legend_style:
        placement: bottom-right

  - name: Persist richness map HTML
    id: persist_richness_html
    task: persist_text
    skipif: {}
    partial:
      text: ${{ workflow.draw_richness_map.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: species_richness

  - name: Richness map widget
    id: richness_map_widget
    task: create_map_widget_single_view
    skipif: {}
    partial:
      title: Species Richness Map
      data: ${{ workflow.persist_richness_html.return }}

  # SECTION 6 — Per-species distribution maps (dynamic — discovers species at runtime)
  # ═══════════════════════════════════════════════════════════════════════════
  # Replaces the old pattern of 116 × 6 hardcoded tasks. One task runs the
  # full per-species pipeline (points GDF → layer → view state → map HTML →
  # PNG → widget) for every species found in the filtered observations, then
  # three lightweight extractor tasks unwrap the three output lists.
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Generate all per-species outputs
    id: per_species_outputs
    task: generate_per_species_outputs
    skipif: {}
    partial:
      gdf: ${{ workflow.filter_species.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      name_column: taxon_name
      buffer_fraction: 0.15
      zoom_extra: 0
      fallback_zoom: 0
      fallback_lat: 0.0
      fallback_lon: 0.0
      map_max_zoom: 5
      png_device_scale_factor: 2.0
      png_wait_for_timeout: 15000
      overlay_widget_scale: 0.65

  - name: Extract per-species widgets
    id: per_species_widgets
    task: get_per_species_widgets
    skipif: {}
    partial:
      outputs: ${{ workflow.per_species_outputs.return }}

  - name: Extract per-species PNG paths
    id: per_species_png_paths
    task: get_per_species_png_paths
    skipif: {}
    partial:
      outputs: ${{ workflow.per_species_outputs.return }}

  - name: Extract per-species species names
    id: per_species_species_names
    task: get_per_species_species_names
    skipif: {}
    partial:
      outputs: ${{ workflow.per_species_outputs.return }}

  - name: Build per-species distribution pages Word doc
    id: per_species_pages_docx
    task: build_per_species_pages_docx
    skipif: {}
    partial:
      species_png_paths: ${{ workflow.per_species_png_paths.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      species_names: ${{ workflow.per_species_species_names.return }}
      filename: per_species_maps.docx
      use_landscape: false
      maps_per_row: 2
      maps_per_col: 3
      heading_font_size_pt: 7
      font_name: Arial

  # ── Report: generate template, render with create_docx, combine with combine_docx_files ──
  # Template is built entirely in code (no external file to pull).
  # create_docx (ecoscope built-in) renders it and handles HTML → PNG conversion
  # internally via Playwright, so no separate html_to_png steps are needed.
  # combine_docx_files (ecoscope built-in) appends the summary table and
  # per-species map pages, producing the final report.
  #
  # Final document order:
  #   1. Cover page
  #   2. All Snake Species Distribution map
  #   3. Observation Effort map
  #   4. Species Richness map
  #   5. Species Summary Table  (appended)
  #   6. Per-Species Distribution Maps  (appended)

  - name: Generate Word report template
    id: report_template
    task: create_report_template
    skipif: {}
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      taaf_logo_url: "https://drive.google.com/uc?export=download&id=1oZN1HvRGiTVr62Bx-pUeGqAAMLT6vPFr"
      ecoscope_logo_url: "https://drive.google.com/uc?export=download&id=1JrJaen6CppzKp9w6eXlmtkAJiwSGO06M"
      filename: report_template.docx
      logo_download_timeout: 45

  - name: Build report template context
    id: report_context
    task: build_maps_context
    skipif: {}
    partial:
      all_snakes_map_html: ${{ workflow.persist_all_species_html.return }}
      effort_map_html: ${{ workflow.persist_effort_html.return }}
      richness_map_html: ${{ workflow.persist_richness_html.return }}
      generation_date: null
      map_width_inches: 6.0
      device_scale_factor: 2.0
      wait_for_timeout: 30000

  - name: Render main report sections
    id: render_report_body
    task: create_docx
    skipif: {}
    partial:
      template_path: ${{ workflow.report_template.return }}
      context: ${{ workflow.report_context.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: snake_distribution_report
      groupers: null

  - name: Assemble final report
    id: final_report
    task: combine_docx_files
    skipif: {}
    partial:
      master_file: ${{ workflow.render_report_body.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      output_filename: taaf_snake_distribution_report
      file_paths:
        - ${{ workflow.summary_table_docx.return }}
        - ${{ workflow.per_species_pages_docx.return }}
      restart_numbering: false

  # SECTION 8 — Dashboard

  - name: Snake sightings dashboard
    id: snake_dashboard
    task: gather_dashboard
    skipif: {}
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.summary_table_widget.return }}
        - ${{ workflow.all_species_widget.return }}
        - ${{ workflow.effort_map_widget.return }}
        - ${{ workflow.richness_map_widget.return }}
        - ${{ workflow.per_species_widgets.return }}
      time_range: ${{ workflow.time_range.return }}
      groupers: ${{ workflow.groupers.return }}
